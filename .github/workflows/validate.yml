name: Validate skills
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-example.txt
      - run: python -m pip install -r requirements-example.txt -r requirements-optional.txt
      - run: python scripts/check_package.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke_notebook.py
        env:
          MPLBACKEND: Agg
  validate-r:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends r-base-core r-cran-jsonlite r-cran-digest
      - run: python -m pip install -r requirements-example.txt
      - run: python scripts/smoke_notebook_r.py
        env:
          MPLBACKEND: Agg
